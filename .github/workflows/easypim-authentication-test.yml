name: "01 - Authentication Test"

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read    # Required for repository access

env:
  # These should be configured as repository secrets or variables
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  KEYVAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME || 'kv-easypim-default' }}

jobs:
  authentication-test:
    name: "🔐 Authentication Test"
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔐 Azure Login (OIDC)"
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: "📋 Verify Azure Context"
        shell: pwsh
        run: |
          Write-Host "🔍 Verifying Azure authentication..." -ForegroundColor Yellow
          
          # Check Azure CLI context
          $context = az account show --query '{subscriptionId:id, tenantId:tenantId, name:name}' -o json | ConvertFrom-Json
          
          if ($context) {
            Write-Host "✅ Azure CLI Authentication SUCCESS!" -ForegroundColor Green
            Write-Host "   Subscription: $($context.name)" -ForegroundColor White
            Write-Host "   Subscription ID: $($context.subscriptionId)" -ForegroundColor White
            Write-Host "   Tenant ID: $($context.tenantId)" -ForegroundColor White
          } else {
            Write-Host "❌ Azure CLI Authentication FAILED!" -ForegroundColor Red
            exit 1
          }

      - name: "🔑 Test Key Vault Access"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "🔑 Testing Key Vault access..." -ForegroundColor Yellow
          Write-Host "   Key Vault: $env:KEYVAULT_NAME" -ForegroundColor Cyan
          
          try {
            # Test Key Vault access
            $secretsJson = az keyvault secret list --vault-name $env:KEYVAULT_NAME --query '[].{Name:name}' -o json
            
            if ($secretsJson -and $secretsJson -ne "[]" -and $secretsJson -ne "null") {
              $secrets = $secretsJson | ConvertFrom-Json
              Write-Host "✅ Key Vault access SUCCESS!" -ForegroundColor Green
              Write-Host "   Available secrets: $($secrets.Count)" -ForegroundColor White
              
              if ($false) {
                Write-Host "   Secret names:" -ForegroundColor Cyan
                $secrets | ForEach-Object { Write-Host "     - $($_.Name)" -ForegroundColor Gray }
              }
            } else {
              Write-Host "⚠️ Key Vault accessible but no secrets found" -ForegroundColor Yellow
            }
            
            # Explicit success
            Write-Host "🔑 Key Vault test completed successfully" -ForegroundColor Green
            exit 0
          } catch {
            Write-Host "❌ Key Vault access FAILED!" -ForegroundColor Red
            Write-Host "   Error: $($_.Exception.Message)" -ForegroundColor Red
            exit 1
          }

      - name: "🔐 Install PowerShell Modules"
        shell: pwsh
        run: |
          Write-Host "📦 Installing required PowerShell modules..." -ForegroundColor Yellow
          
          $modules = @(
            'Microsoft.Graph.Authentication',
            'EasyPIM.Orchestrator'
          )
          
          foreach ($module in $modules) {
            Write-Host "   Installing: $module" -ForegroundColor Cyan
            try {
              # Force remove existing module if loaded to avoid conflicts
              if (Get-Module -Name $module -ErrorAction SilentlyContinue) {
                Write-Host "     Removing existing loaded module..." -ForegroundColor Gray
                Remove-Module -Name $module -Force -ErrorAction SilentlyContinue
              }
              
              # Install with retry logic for conflicting module issues
              $installAttempt = 1
              $maxAttempts = 3
              do {
                try {
                  Install-Module -Name $module -Force -AllowClobber -Scope CurrentUser -Repository PSGallery -ErrorAction Stop
                  Write-Host "     ✅ Installation successful" -ForegroundColor Green
                  break
                } catch {
                  Write-Host "     ⚠️ Install attempt $installAttempt failed: $($_.Exception.Message)" -ForegroundColor Yellow
                  $installAttempt++
                  if ($installAttempt -le $maxAttempts) {
                    Write-Host "     Retrying in 2 seconds..." -ForegroundColor Gray
                    Start-Sleep 2
                  }
                }
              } while ($installAttempt -le $maxAttempts)
              
              # Import the module
              Write-Host "     Importing module..." -ForegroundColor Gray
              Import-Module -Name $module -Force -ErrorAction Stop
              Write-Host "     ✅ Module imported successfully" -ForegroundColor Green
              
            } catch {
              Write-Host "     ❌ Failed to install/import $module`: $($_.Exception.Message)" -ForegroundColor Red
              # Continue with other modules instead of failing completely
            }
          }
          
          Write-Host "✅ PowerShell modules installation completed!" -ForegroundColor Green

      - name: "📊 Test Microsoft Graph Authentication"
        shell: pwsh
        run: |
          Write-Host "🔐 Testing Microsoft Graph authentication..." -ForegroundColor Yellow
          
          try {
            # Get access token using Azure CLI (which uses OIDC)
            $graphToken = az account get-access-token --resource "https://graph.microsoft.com/" --query "accessToken" -o tsv
            
            if ($graphToken) {
              Write-Host "✅ Graph token obtained!" -ForegroundColor Green
              
              # Test connecting to Microsoft Graph
              $secureToken = ConvertTo-SecureString $graphToken -AsPlainText -Force
              Connect-MgGraph -AccessToken $secureToken -NoWelcome
              
              $context = Get-MgContext
              if ($context) {
                Write-Host "✅ Microsoft Graph Connected!" -ForegroundColor Green
                Write-Host "   Client ID: $($context.ClientId)" -ForegroundColor White
                Write-Host "   Tenant ID: $($context.TenantId)" -ForegroundColor White
                Write-Host "   Scopes: $($context.Scopes -join ', ')" -ForegroundColor White
              } else {
                throw "Microsoft Graph context not established"
              }
            } else {
              throw "Failed to obtain Graph token"
            }
          } catch {
            Write-Host "❌ Microsoft Graph authentication FAILED!" -ForegroundColor Red
            Write-Host "   Error: $($_.Exception.Message)" -ForegroundColor Red
            exit 1
          }

      - name: "🎯 Test EasyPIM Module"
        shell: pwsh
        run: |
          Write-Host "🎯 Testing EasyPIM.Orchestrator module..." -ForegroundColor Yellow
          
          try {
            # First, try to import the module again to ensure it's loaded
            Write-Host "   Ensuring module is loaded..." -ForegroundColor Gray
            Import-Module -Name EasyPIM.Orchestrator -Force -ErrorAction Stop
            
            # Check if EasyPIM module is properly loaded
            $module = Get-Module -Name EasyPIM.Orchestrator
            if ($module) {
              Write-Host "✅ EasyPIM.Orchestrator loaded!" -ForegroundColor Green
              Write-Host "   Version: $($module.Version)" -ForegroundColor White
              Write-Host "   Module Path: $($module.ModuleBase)" -ForegroundColor Gray
              
              # List available commands
              $commands = Get-Command -Module EasyPIM.Orchestrator -ErrorAction SilentlyContinue
              if ($commands) {
                Write-Host "   Available commands: $($commands.Count)" -ForegroundColor White
                
                if ($false) {
                  Write-Host "   Command list:" -ForegroundColor Cyan
                  $commands | ForEach-Object { Write-Host "     - $($_.Name)" -ForegroundColor Gray }
                }
              } else {
                Write-Host "   ⚠️ No commands found in module (this might be expected)" -ForegroundColor Yellow
              }
              
              Write-Host "✅ EasyPIM module test PASSED!" -ForegroundColor Green
              
            } else {
              throw "EasyPIM.Orchestrator module not loaded"
            }
          } catch {
            Write-Host "❌ EasyPIM module test FAILED!" -ForegroundColor Red
            Write-Host "   Error: $($_.Exception.Message)" -ForegroundColor Red
            
            # Diagnostic information
            Write-Host "📋 Module diagnostics:" -ForegroundColor Cyan
            $allModules = Get-Module -ListAvailable | Where-Object { $_.Name -like "*EasyPIM*" -or $_.Name -like "*Graph*" }
            if ($allModules) {
              Write-Host "   Available related modules:" -ForegroundColor Gray
              $allModules | ForEach-Object { Write-Host "     - $($_.Name) v$($_.Version)" -ForegroundColor Gray }
            } else {
              Write-Host "   No EasyPIM or Graph modules found in available modules" -ForegroundColor Yellow
            }
            
            # Check PowerShell Gallery availability
            try {
              $moduleInfo = Find-Module -Name EasyPIM.Orchestrator -ErrorAction Stop
              Write-Host "   Module exists in PowerShell Gallery: v$($moduleInfo.Version)" -ForegroundColor Gray
            } catch {
              Write-Host "   ⚠️ Could not find EasyPIM.Orchestrator in PowerShell Gallery: $($_.Exception.Message)" -ForegroundColor Yellow
            }
            
            exit 1
          }

      - name: "📋 Authentication Summary"
        if: always()
        shell: pwsh
        run: |
          Write-Host "" -ForegroundColor White
          Write-Host "═══════════════════════════════════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "                    🔐 EasyPIM Authentication Test Results" -ForegroundColor Cyan
          Write-Host "═══════════════════════════════════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "" -ForegroundColor White

          $status = '${{ job.status }}'
          $testResult = if ($status -eq 'success') { '✅ PASSED' } else { '❌ FAILED' }

          Write-Host "🎯 Test Summary" -ForegroundColor Yellow
          Write-Host "┌─────────────────────────────┬────────────────┐" -ForegroundColor Gray
          Write-Host "│ Azure OIDC Authentication   │ $testResult      │" -ForegroundColor Gray
          Write-Host "│ Key Vault Access            │ $testResult      │" -ForegroundColor Gray
          Write-Host "│ Microsoft Graph Token       │ $testResult      │" -ForegroundColor Gray
          Write-Host "│ EasyPIM Module              │ $testResult      │" -ForegroundColor Gray
          Write-Host "└─────────────────────────────┴────────────────┘" -ForegroundColor Gray
          Write-Host "" -ForegroundColor White

          Write-Host "⚙️ Configuration" -ForegroundColor Yellow
          Write-Host "┌─────────────────────────────┬────────────────┐" -ForegroundColor Gray
          Write-Host "│ Repository                  │ ${{ github.repository }}" -ForegroundColor Gray
          Write-Host "│ Key Vault                   │ $env:KEYVAULT_NAME" -ForegroundColor Gray
          Write-Host "│ Tenant ID                   │ $env:AZURE_TENANT_ID" -ForegroundColor Gray
          Write-Host "│ Subscription ID             │ $env:AZURE_SUBSCRIPTION_ID" -ForegroundColor Gray
          Write-Host "└─────────────────────────────┴────────────────┘" -ForegroundColor Gray
          Write-Host "" -ForegroundColor White

          if ($status -eq 'success') {
            Write-Host "🎉 SUCCESS: Your EasyPIM authentication is properly configured!" -ForegroundColor Green
            Write-Host "   You can now run the main EasyPIM workflows with confidence." -ForegroundColor White
          } else {
            Write-Host "❌ FAILED: One or more authentication tests did not pass." -ForegroundColor Red
            Write-Host "   Review the step logs above for details." -ForegroundColor White
          }
          Write-Host "" -ForegroundColor White

          Write-Host "🚀 Next Steps:" -ForegroundColor Yellow
          Write-Host "• Run 'EasyPIM Orchestrator' workflow for PIM management" -ForegroundColor White
          Write-Host "• Run 'EasyPIM Drift Detection' workflow for compliance monitoring" -ForegroundColor White
          Write-Host "• Configure scheduled runs for automated governance" -ForegroundColor White

          # Write GitHub Step Summary
          $statusIcon = if ($status -eq 'success') { '✅' } else { '❌' }
          $statusBadge = if ($status -eq 'success') { '🟢 **SUCCESS**' } else { '🔴 **FAILED**' }

          $summary = @"
          # $statusIcon EasyPIM Authentication Test

          ## 🎯 Test Overview

          | 🚦 **Status** | 👤 **Triggered By** | ⏰ **Timestamp** |
          |---------------|---------------------|------------------|
          | $statusBadge | ${{ github.actor }} | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC') |

          ## 🔐 Authentication Results

          | Test | Status |
          |------|--------|
          | Azure OIDC Authentication | $testResult |
          | Key Vault Access | $testResult |
          | Microsoft Graph Token | $testResult |
          | EasyPIM Module | $testResult |

          ## ⚙️ Configuration

          | Setting | Value |
          |---------|-------|
          | **Key Vault** | ``$env:KEYVAULT_NAME`` |
          | **Tenant ID** | ``$env:AZURE_TENANT_ID`` |
          | **Subscription ID** | ``$env:AZURE_SUBSCRIPTION_ID`` |

          ## 🚀 Next Steps

          | Phase | Workflow | Description |
          |-------|----------|-------------|
          | **Phase 2** | [EasyPIM Orchestrator](https://github.com/${{ github.repository }}/actions/workflows/02-orchestrator-test.yml) | Apply PIM configuration |
          | **Phase 3** | [Drift Detection](https://github.com/${{ github.repository }}/actions/workflows/03-policy-drift-check.yml) | Monitor compliance |

          ---

          <details>
          <summary>🔧 <strong>Technical Details</strong></summary>

          - **Run ID:** ``${{ github.run_id }}``
          - **Run Number:** ``#${{ github.run_number }}``
          - **Repository:** ``${{ github.repository }}``
          - **Branch:** ``${{ github.ref_name }}``

          </details>
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "✅ Step summary written to GitHub Actions dashboard" -ForegroundColor Green
